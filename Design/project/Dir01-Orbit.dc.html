<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction 1: Orbit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#9FD4FF}a:hover{color:#CDE9FF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: radial-gradient(120% 80% at 50% 110%, #12203A 0%, #070B16 55%); color: #EAF2FF; font-family: Sora, sans-serif">

  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; inset: 0">
    <ellipse cx="720" cy="760" rx="640" ry="90" fill="none" stroke="rgba(159,212,255,0.25)" stroke-width="1"></ellipse>
    <ellipse cx="720" cy="760" rx="520" ry="70" fill="none" stroke="rgba(159,212,255,0.12)" stroke-width="1"></ellipse>
    <circle cx="720" cy="850" r="5" fill="#9FD4FF"></circle>
    <circle cx="260" cy="790" r="3" fill="rgba(234,242,255,0.5)"></circle>
    <circle cx="1180" cy="790" r="3" fill="rgba(234,242,255,0.5)"></circle>
  </svg>

  <div style="position: absolute; top: 32px; left: 40px; font-weight: 600; letter-spacing: 6px; font-size: 13px">DANTE</div>
  <div style="position: absolute; top: 32px; right: 40px; font-weight: 300; font-size: 13px; color: rgba(234,242,255,0.7)">15:42 · Work</div>

  <!-- Windows on an orbit -->
  <div style="position: absolute; left: 0; right: 0; top: 120px; height: 600px; perspective: 1600px; display: flex; justify-content: center; align-items: center">
    <div style="position: absolute; width: 380px; height: 420px; transform: translateX(-640px) translateZ(-420px) rotateY(48deg); border-radius: 28px; background: rgba(159,212,255,0.06); border: 1px solid rgba(159,212,255,0.18); padding: 28px; box-sizing: border-box; opacity: 0.55">
      <div style="font-size: 13px; color: rgba(234,242,255,0.7)">Mail</div>
      <div style="margin-top: 24px; height: 10px; width: 70%; border-radius: 5px; background: rgba(234,242,255,0.18)"></div>
      <div style="margin-top: 12px; height: 10px; width: 50%; border-radius: 5px; background: rgba(234,242,255,0.12)"></div>
    </div>
    <div style="position: absolute; width: 440px; height: 480px; transform: translateX(-390px) translateZ(-160px) rotateY(28deg); border-radius: 30px; background: rgba(159,212,255,0.08); border: 1px solid rgba(159,212,255,0.22); padding: 28px; box-sizing: border-box; opacity: 0.8">
      <div style="font-size: 13px; color: rgba(234,242,255,0.7)">Terminal</div>
      <div style="margin-top: 24px; font-family: monospace; font-size: 13px; line-height: 1.8; color: #9FD4FF">❯ ./run.sh<br>Dante kernel ready</div>
    </div>
    <div style="position: absolute; width: 440px; height: 480px; transform: translateX(390px) translateZ(-160px) rotateY(-28deg); border-radius: 30px; background: rgba(159,212,255,0.08); border: 1px solid rgba(159,212,255,0.22); padding: 28px; box-sizing: border-box; opacity: 0.8">
      <div style="font-size: 13px; color: rgba(234,242,255,0.7)">Files</div>
      <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <div style="height: 72px; border-radius: 16px; background: rgba(159,212,255,0.14)"></div>
        <div style="height: 72px; border-radius: 16px; background: rgba(159,212,255,0.1)"></div>
        <div style="height: 72px; border-radius: 16px; background: rgba(159,212,255,0.1)"></div>
      </div>
    </div>
    <div style="position: absolute; width: 380px; height: 420px; transform: translateX(640px) translateZ(-420px) rotateY(-48deg); border-radius: 28px; background: rgba(159,212,255,0.06); border: 1px solid rgba(159,212,255,0.18); padding: 28px; box-sizing: border-box; opacity: 0.55">
      <div style="font-size: 13px; color: rgba(234,242,255,0.7)">Music</div>
    </div>
    <!-- Focused -->
    <div style="position: relative; width: 560px; height: 560px; border-radius: 34px; background: rgba(14,22,40,0.85); border: 1px solid rgba(159,212,255,0.4); box-shadow: 0 0 0 8px rgba(159,212,255,0.05), 0 60px 120px rgba(0,0,0,0.6); padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <div style="font-size: 13px; color: #9FD4FF">Notes</div>
      <div style="font-weight: 600; font-size: 34px; line-height: 1.15">Kernel roadmap</div>
      <div style="font-weight: 300; font-size: 16px; line-height: 1.8; color: rgba(234,242,255,0.78)">1. Interrupts and a timer<br>2. Memory: paging and a heap<br>3. Processes and a scheduler<br>4. Files and a shell</div>
    </div>
  </div>

  <div style="position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 300; color: rgba(234,242,255,0.6); letter-spacing: 1px">Swipe to rotate the orbit · pinch to see every space</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
