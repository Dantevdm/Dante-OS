<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dante First Light: permission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&amp;family=IBM+Plex+Mono:wght@300;400&amp;display=swap">
<style>
body{margin:0}
a{color:#3F6E7C}a:hover{color:#2C5260}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 880px; height: 640px; position: relative; overflow: hidden; background: #F7F8F6; color: #1E2A30; font-family: 'Inter Tight', sans-serif; font-weight: 300">
  <span style="position: absolute; left: 24px; top: 24px; width: 12px; height: 12px; border-left: 1px solid #7F969D; border-top: 1px solid #7F969D"></span>
  <span style="position: absolute; right: 24px; bottom: 24px; width: 12px; height: 12px; border-right: 1px solid #7F969D; border-bottom: 1px solid #7F969D"></span>
  <div role="dialog" aria-label="Permission request" style="position: absolute; left: 64px; right: 64px; top: 72px; bottom: 64px; display: flex; flex-direction: column">
    <span style="display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E6B70"><span style="width: 7px; height: 7px; border-radius: 99px; background: #C7794E"></span>spreadsheet · windows app</span>
    <span style="margin-top: 28px; font-weight: 200; font-size: 64px; line-height: 1.02; letter-spacing: -2.5px">Spreadsheet wants to open Finance.</span>
    <span style="margin-top: 22px; font-size: 17px; line-height: 1.6; color: #46545A; max-width: 560px">It will see Documents / Finance and nothing else. You can change this later in Settings.</span>
    <span style="flex: 1"></span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #1E2A30">
      <button style="height: 64px; border: 0; background: transparent; text-align: left; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 10px"><span style="width: 8px; height: 8px; border-radius: 99px; background: {{accent}}"></span>Allow</button>
      <button style="height: 64px; border: 0; background: transparent; text-align: left; font-size: 18px; color: #46545A">Just once</button>
      <button style="height: 64px; border: 0; background: transparent; text-align: left; font-size: 18px; color: #46545A">Don’t allow</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3F6E7C","options":["#3F6E7C","#C7794E","#5F7F68","#1E2A30"]},"$preview":{"width":880,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#3F6E7C' };
  }
}
</script>
</body>
</html>
