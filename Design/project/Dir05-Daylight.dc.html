<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction 5: Daylight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5FE0}a:hover{color:#1D45B8}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: linear-gradient(180deg, #CFE3FF 0%, #EAF2FF 45%, #F7F9FC 100%); color: #101828; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px">

  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; inset: 0">
    <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"></feGaussianBlur></filter></defs>
    <g filter="url(#soft)">
      <ellipse cx="1150" cy="160" rx="300" ry="140" fill="#FFFFFF"></ellipse>
      <ellipse cx="300" cy="260" rx="260" ry="110" fill="#FFFFFF" opacity="0.8"></ellipse>
    </g>
  </svg>

  <div style="position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 24px; height: 44px; padding: 0 22px; border-radius: 999px; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); box-shadow: 0 8px 24px rgba(16,24,40,0.08); font-weight: 500">
    <span style="font-weight: 800; letter-spacing: 2px">DANTE</span>
    <span style="color: #2F5FE0; font-weight: 700">Work</span>
    <span style="color: #475467">Code</span>
    <span style="color: #475467">Home</span>
    <span style="color: #475467">15:42</span>
  </div>

  <section aria-label="Files window" style="position: absolute; left: 140px; top: 110px; width: 760px; height: 580px; border-radius: 30px; background: rgba(255,255,255,0.82); backdrop-filter: blur(30px); box-shadow: 0 30px 80px rgba(16,24,40,0.12); padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-weight: 800; font-size: 32px; letter-spacing: -0.5px">dante-os</span>
      <span style="color: #475467">4 folders · 3 files</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <div style="height: 150px; border-radius: 22px; background: #2F5FE0; color: #FFFFFF; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 700; font-size: 16px">kernel</span><span style="opacity: 0.85">Edited today</span></div>
      <div style="height: 150px; border-radius: 22px; background: #EEF3FB; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 700; font-size: 16px">compositor</span><span style="color: #475467">Yesterday</span></div>
      <div style="height: 150px; border-radius: 22px; background: #EEF3FB; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 700; font-size: 16px">win32-compat</span><span style="color: #475467">21 Nov</span></div>
      <div style="height: 150px; border-radius: 22px; background: #EEF3FB; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 700; font-size: 16px">Roadmap.md</span><span style="color: #475467">20 Nov</span></div>
      <div style="height: 150px; border-radius: 22px; background: #FFF4E5; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 700; font-size: 16px">Budget.xlsx</span><span style="color: #93500E">Windows file</span></div>
      <div style="height: 150px; border-radius: 22px; background: #EEF3FB; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 700; font-size: 16px">Notes.txt</span><span style="color: #475467">12 Nov</span></div>
    </div>
  </section>

  <aside style="position: absolute; left: 930px; top: 110px; width: 370px; display: flex; flex-direction: column; gap: 16px">
    <div style="border-radius: 30px; background: rgba(255,255,255,0.82); backdrop-filter: blur(30px); box-shadow: 0 30px 80px rgba(16,24,40,0.1); padding: 28px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 800; font-size: 64px; letter-spacing: -2px; line-height: 1">15:42</span>
      <span style="color: #475467; font-size: 16px">Monday, 23 November</span>
    </div>
    <div style="border-radius: 30px; background: rgba(255,255,255,0.82); backdrop-filter: blur(30px); box-shadow: 0 30px 80px rgba(16,24,40,0.1); padding: 28px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #2F5FE0">UP NEXT</span>
      <span style="font-weight: 700; font-size: 20px">Kernel design review</span>
      <span style="color: #475467">16:30 · 45 min</span>
    </div>
  </aside>

  <nav aria-label="Dock" style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; border-radius: 28px; background: rgba(255,255,255,0.75); backdrop-filter: blur(20px); box-shadow: 0 12px 30px rgba(16,24,40,0.1)">
    <button aria-label="Files" style="width: 52px; height: 52px; border: 0; border-radius: 17px; background: #2F5FE0"></button>
    <button aria-label="Terminal" style="width: 52px; height: 52px; border: 0; border-radius: 17px; background: #101828"></button>
    <button aria-label="Browser" style="width: 52px; height: 52px; border: 0; border-radius: 17px; background: #EEF3FB"></button>
    <button aria-label="Mail" style="width: 52px; height: 52px; border: 0; border-radius: 17px; background: #EEF3FB"></button>
    <button aria-label="Calendar" style="width: 52px; height: 52px; border: 0; border-radius: 17px; background: #EEF3FB"></button>
    <button aria-label="Windows apps" style="width: 52px; height: 52px; border: 0; border-radius: 17px; background: #FFF4E5"></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
