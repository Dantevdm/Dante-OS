<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dante OS boot screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#C8FF2E}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #050408; color: #F5F3FF; font-family: Unbounded, sans-serif">
  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; inset: 0">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"></feGaussianBlur></filter></defs>
    <g filter="url(#glow)">
      <circle cx="680" cy="390" r="130" fill="#6D2BFF" opacity="0.8"></circle>
      <circle cx="780" cy="430" r="110" fill="#FF3D7F" opacity="0.6"></circle>
    </g>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 30px">
    <span style="width: 128px; height: 128px; border-radius: 40px; background: #C8FF2E; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 80px rgba(200,255,46,0.35)">
      <svg role="img" aria-label="Dante OS logo" width="76" height="76" viewBox="0 0 24 24"><path d="M5 3h7a9 9 0 0 1 0 18H5z" fill="none" stroke="#08070D" stroke-width="2.6"></path><path d="M9 8h3a4 4 0 0 1 0 8H9z" fill="#08070D"></path></svg>
    </span>
    <span style="font-weight: 800; font-size: 44px; letter-spacing: 14px; padding-left: 14px">DANTE</span>
    <div style="width: 240px; height: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden">
      <div style="width: {{progress}}%; height: 100%; border-radius: 6px; background: #C8FF2E"></div>
    </div>
  </div>

  <pre style="position: absolute; left: 36px; bottom: 32px; margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.8; color: rgba(245,243,255,0.6)">kernel 0.1.0 · x86-64 · UEFI
1995 MiB usable · 4 cores online
<span style="color: #C8FF2E">ready</span></pre>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","default":62,"min":0,"max":100,"step":1,"unit":"%"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { progress: this.props.progress ?? 62 };
  }
}
</script>
</body>
</html>
