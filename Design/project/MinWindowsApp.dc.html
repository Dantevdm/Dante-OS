<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dante First Light: Windows app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&amp;family=IBM+Plex+Mono:wght@300;400&amp;display=swap">
<style>
body{margin:0}
a{color:#3F6E7C}a:hover{color:#2C5260}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #EEEFEC; color: #1E2A30; font-family: 'Inter Tight', sans-serif; font-weight: 300">

  <header style="position: absolute; top: 30px; left: 56px; right: 56px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #5E6B70">
    <span style="color: #1E2A30">DANTE</span>
    <span style="text-align: center"><span style="color: #1E2A30">work</span>   code   home</span>
    <span style="text-align: right">06:14</span>
  </header>

  <!-- The Windows app keeps its own UI, inside a plain Dante frame -->
  <section aria-label="Spreadsheet" style="position: absolute; left: 56px; top: 80px; width: 980px; height: 780px; border: 1px solid #C9D1D2; border-radius: 10px; background: #F7F8F6; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <span style="position: absolute; left: -5px; top: -5px; width: 9px; height: 9px; border-left: 1px solid #7F969D; border-top: 1px solid #7F969D"></span>
    <span style="position: absolute; right: -5px; bottom: -5px; width: 9px; height: 9px; border-right: 1px solid #7F969D; border-bottom: 1px solid #7F969D"></span>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E6B70; padding: 0 4px">
      <span>03 — spreadsheet / budget 2027.xlsx</span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 99px; background: #C7794E"></span>windows app</span>
    </div>
    <div style="flex: 1; border-radius: 6px; overflow: hidden; background: #FFFFFF; border: 1px solid #DCE2E2; display: flex; flex-direction: column">
      <div style="display: flex; gap: 20px; padding: 9px 14px; font-size: 13px; border-bottom: 1px solid #E4E4E4; font-weight: 400">
        <span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Data</span>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: 44px 220px repeat(5, minmax(0, 1fr)); grid-auto-rows: 28px; font-size: 13px; font-weight: 400; overflow: hidden">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="80">
          <div style="{{c.style}}">{{c.v}}</div>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- Explanation -->
  <aside style="position: absolute; left: 1084px; top: 80px; width: 300px; display: flex; flex-direction: column; gap: 22px">
    <span style="font-weight: 200; font-size: 44px; line-height: 1.05; letter-spacing: -1.5px">A Windows app. Running natively.</span>
    <span style="font-size: 16px; line-height: 1.6; color: #46545A">No virtual machine, no copy of Windows. Dante translates what the app asks for as it runs.</span>
    <div style="display: flex; flex-direction: column; margin-top: 18px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E6B70; padding-bottom: 12px">access</span>
      <sc-for list="{{access}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 1px solid #D3DADA; font-size: 15px">
          <span>{{a.name}}</span>
          <span role="switch" aria-checked="{{a.on}}" aria-label="{{a.name}}" style="position: relative; width: 52px; height: 28px; display: block">
            <span style="position: absolute; left: 2px; top: 10px; width: 8px; height: 8px; border-radius: 99px; background: #1E2A30"></span>
            <span style="{{a.arm}}"></span>
            <span style="{{a.knob}}"></span>
          </span>
        </div>
      </sc-for>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3F6E7C","options":["#3F6E7C","#C7794E","#5F7F68","#1E2A30"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3F6E7C';
    const head = 'background: #F4F5F3; color: #5E6B70; display: flex; align-items: center; justify-content: center; border-right: 1px solid #E4E6E4; border-bottom: 1px solid #E4E6E4';
    const cell = 'background: #FFFFFF; padding: 0 10px; display: flex; align-items: center; border-right: 1px solid #EFF0EE; border-bottom: 1px solid #EFF0EE';
    const rows = [['Category', 'Q1', 'Q2', 'Q3', 'Q4', 'Total'], ['Hardware'], ['Software licences'], ['Subtotal']];
    const cells = [];
    ['', 'A', 'B', 'C', 'D', 'E', 'F'].forEach((h) => cells.push({ v: h, style: head }));
    for (let r = 0; r < 24; r++) {
      const data = rows[r] || [];
      cells.push({ v: String(r + 1), style: head });
      for (let c = 0; c < 6; c++) {
        const num = r >= 1 && r <= 3 && c >= 1;
        cells.push({ v: data[c] || (num ? '[AMOUNT]' : ''), style: cell + ((r === 0 || r === 3) ? '; font-weight: 600' : '') + (num ? '; justify-content: flex-end; color: #5E6B70' : '') });
      }
    }
    // Switches drawn as levers: a pivot, an arm and a knob, up for on, down for off.
    const lever = (on) => ({
      arm: 'position: absolute; left: 6px; top: 13px; width: 34px; height: 2px; transform-origin: 0 50%; transform: rotate(' + (on ? -24 : 24) + 'deg); background: ' + (on ? accent : '#8FA0A5'),
      knob: 'position: absolute; left: 32px; top: ' + (on ? -5 : 23) + 'px; width: 10px; height: 10px; border-radius: 99px; background: ' + (on ? accent : '#8FA0A5')
    });
    const access = [
      { name: 'Documents / Finance', on: true },
      { name: 'Rest of home', on: false },
      { name: 'Internet', on: false },
      { name: 'Printer', on: true }
    ].map((a) => ({ ...a, ...lever(a.on), on: String(a.on) }));
    return { accent, cells, access };
  }
}
</script>
</body>
</html>
