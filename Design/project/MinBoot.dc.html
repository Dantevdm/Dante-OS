<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dante First Light: boot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300&amp;family=IBM+Plex+Mono:wght@300;400&amp;display=swap">
<style>
body{margin:0}
a{color:#3F6E7C}a:hover{color:#2C5260}
@keyframes dante-turn{to{transform:rotate(360deg)}}
@keyframes dante-fill{from{width:0}}
@keyframes dante-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: linear-gradient(180deg, #F4E7DC 0%, #ECEDEA 55%, #E3E9EA 100%); color: #1E2A30; font-family: 'Inter Tight', sans-serif; font-weight: 200">

  <div style="position: absolute; left: 0; right: 0; top: 260px; display: flex; flex-direction: column; align-items: center; gap: 34px">
    <svg role="img" aria-label="Dante gear" width="132" height="132" viewBox="0 0 120 120">
      <g style="transform-origin: 60px 60px; animation: dante-turn 24s linear infinite">
        <polygon points="{{gear}}" fill="none" stroke="#1E2A30" stroke-width="1.2" stroke-linejoin="round"></polygon>
        <circle cx="60" cy="60" r="20" fill="none" stroke="#1E2A30" stroke-width="1.2"></circle>
        <line x1="60" y1="60" x2="60" y2="40" stroke="{{accent}}" stroke-width="1.2"></line>
      </g>
      <circle cx="60" cy="60" r="5" fill="{{accent}}"></circle>
    </svg>
    <span style="font-size: 52px; letter-spacing: 18px; padding-left: 18px; animation: dante-rise 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.3s both">DANTE</span>

    <!-- Progress as a ruler -->
    <div style="width: 320px; display: flex; flex-direction: column; gap: 8px">
      <div style="position: relative; height: 12px">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: #7F969D"></div>
        <div style="position: absolute; left: 0; bottom: 0; height: 2px; width: {{progress}}%; background: {{accent}}; animation: dante-fill 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both"></div>
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="11">
          <div style="{{t.style}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5E6B70"><span>0</span><span>{{progress}}</span><span>100</span></div>
    </div>
  </div>

  <pre style="position: absolute; left: 56px; bottom: 44px; margin: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 12px; line-height: 1.9; color: #5E6B70">kernel 0.1.0 · x86-64 · UEFI
1995 MiB usable · 4 cores online
<span style="color: {{accent}}">ready</span></pre>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3F6E7C","options":["#3F6E7C","#C7794E","#5F7F68","#1E2A30"]},"progress":{"editor":"range","default":62,"min":0,"max":100,"step":1},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3F6E7C';
    const progress = this.props.progress ?? 62;
    // A 12-tooth gear outline.
    const teeth = 12, R = 52, r = 42, pts = [];
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2, step = Math.PI * 2 / teeth;
      [[r, 0], [R, step * 0.18], [R, step * 0.5], [r, step * 0.68]].forEach(([rad, off]) => {
        pts.push((60 + rad * Math.cos(a + off)).toFixed(1) + ',' + (60 + rad * Math.sin(a + off)).toFixed(1));
      });
    }
    const ticks = Array.from({ length: 11 }, (_, i) => ({
      style: 'position: absolute; bottom: 0; width: 1px; background: #7F969D; left: ' + (i * 10) + '%; height: ' + (i % 5 === 0 ? 12 : 6) + 'px'
    }));
    return { accent, progress, gear: pts.join(' '), ticks };
  }
}
</script>
</body>
</html>
